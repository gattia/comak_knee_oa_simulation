# The AddBiomechanics engine's environment, exported from the one that scaled the
# paper's gait donors. Linux x86-64.
#
#   conda env create -f tools/addbiomechanics/environment.yml
#
# The engine's own requirements are nimblephysics 0.10.52.1 and numpy 1.24.4
# (AddBiomechanics server/engine/requirements.txt); everything else below is what
# pip resolved for them. nimblephysics requires torch, and the PyPI torch wheel
# brings its CUDA libraries; AddBiomechanics does not use the GPU.
#
# This environment has no OpenSim. The engine needs OpenSim's command-line tool,
# which comes from a second, small environment (opensim_environment.yml), and
# imports the opensim Python module only for features that are switched off.
# tools/addbiomechanics/README.md explains both.

name: ab_engine

channels:
  - conda-forge

dependencies:
  - python=3.9.23
  - pip=25.2
  - pip:
      - nimblephysics==0.10.52.1
      - numpy==1.24.4
      - scipy==1.13.1
      - pandas==2.3.3
      - matplotlib==3.9.4
      - torch==2.8.0
      - triton==3.4.0
      - nvidia-cublas-cu12==12.8.4.1
      - nvidia-cuda-cupti-cu12==12.8.90
      - nvidia-cuda-nvrtc-cu12==12.8.93
      - nvidia-cuda-runtime-cu12==12.8.90
      - nvidia-cudnn-cu12==9.10.2.21
      - nvidia-cufft-cu12==11.3.3.83
      - nvidia-cufile-cu12==1.13.1.3
      - nvidia-curand-cu12==10.3.9.90
      - nvidia-cusolver-cu12==11.7.3.90
      - nvidia-cusparse-cu12==12.5.8.93
      - nvidia-cusparselt-cu12==0.7.1
      - nvidia-nccl-cu12==2.27.3
      - nvidia-nvjitlink-cu12==12.8.93
      - nvidia-nvtx-cu12==12.8.90
      - contourpy==1.3.0
      - cycler==0.12.1
      - filelock==3.19.1
      - fonttools==4.60.2
      - fsspec==2025.10.0
      - importlib-metadata==8.7.1
      - importlib-resources==6.5.2
      - jinja2==3.1.6
      - kiwisolver==1.4.7
      - markupsafe==3.0.4
      - mpmath==1.3.0
      - networkx==3.2.1
      - packaging==26.3
      - pillow==11.3.0
      - pyparsing==3.3.3
      - python-dateutil==2.9.0.post0
      - pytz==2026.4
      - six==1.17.0
      - sympy==1.14.0
      - typing-extensions==4.16.0
      - tzdata==2026.5
      - zipp==3.23.1
