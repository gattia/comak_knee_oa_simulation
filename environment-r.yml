# The R environment that fits the figures' mixed models (Figures 2, 3, 4 and 6).
#
#   conda env create -f environment-r.yml
#   conda activate comak-r
#
# Versions are those of the environment the model fits were made in (the four
# packages docs/r_environment.md names, and their dependencies). The
# solver packages lme4 depends on are pinned too, because they decide where an
# optimiser stops. R is needed only to re-fit; rendering reads the fitted output
# in 04_results.
#
# r-pbkrtest is left out. The scripts set their degrees-of-freedom method
# explicitly (asymptotic or Satterthwaite), so its presence would not change the
# results; without it emmeans cannot be tempted into Kenward-Roger.

name: comak-r

channels:
  - conda-forge

dependencies:
  - r-base=4.5.3
  - r-lme4=2.0_6
  - r-lmertest=3.2_1
  - r-emmeans=2.0.4
  - r-data.table=1.18.6.1
  - r-matrix=1.7_5
  - r-minqa=1.2.8
  - r-nloptr=2.2.1
  - r-numderiv=2016.8_1.1
  - r-mass=7.3_66
  - r-nlme=3.1_170
  - r-estimability=2.0.0
  - r-mvtnorm=1.4_2
